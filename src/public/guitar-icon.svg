<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="guitarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#guitarGradient)"/>
  
  <!-- Guitar body -->
  <ellipse cx="32" cy="38" rx="12" ry="14" fill="#ffffff" opacity="0.9"/>
  
  <!-- Sound hole -->
  <circle cx="32" cy="38" r="4" fill="#4f46e5"/>
  
  <!-- Guitar neck -->
  <rect x="28" y="8" width="8" height="20" fill="#ffffff" opacity="0.9" rx="2"/>
  
  <!-- Frets -->
  <line x1="28" y1="12" x2="36" y2="12" stroke="#4f46e5" stroke-width="1"/>
  <line x1="28" y1="16" x2="36" y2="16" stroke="#4f46e5" stroke-width="1"/>
  <line x1="28" y1="20" x2="36" y2="20" stroke="#4f46e5" stroke-width="1"/>
  <line x1="28" y1="24" x2="36" y2="24" stroke="#4f46e5" stroke-width="1"/>
  
  <!-- Strings -->
  <line x1="30" y1="8" x2="30" y2="52" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
  <line x1="32" y1="8" x2="32" y2="52" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
  <line x1="34" y1="8" x2="34" y2="52" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Bridge -->
  <rect x="26" y="50" width="12" height="2" fill="#ffffff" opacity="0.9" rx="1"/>
</svg>
